name: Build PDF Semplice APK

on:
  push:
    branches:
      - pdf-semplice-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recreate clean Android project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p pdf-ci
          cat .ci/pdf-payload/part0* > /tmp/pdf-ci-project.tgz.b64
          base64 -d /tmp/pdf-ci-project.tgz.b64 > /tmp/pdf-ci-project.tgz
          echo "a08bcef9e50b7dfe6cc06e7777a00abbc3e8f696cc72dcc7d9a8eb48da17a32d  /tmp/pdf-ci-project.tgz" | sha256sum -c -
          tar -xzf /tmp/pdf-ci-project.tgz -C pdf-ci

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Download bundled JavaScript libraries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p pdf-ci/app/src/main/assets/libs
          curl -fL --retry 3 -o pdf-ci/app/src/main/assets/libs/pdf-lib.min.js https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js
          curl -fL --retry 3 -o pdf-ci/app/src/main/assets/libs/pdf.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js
          curl -fL --retry 3 -o pdf-ci/app/src/main/assets/libs/pdf.worker.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js
          curl -fL --retry 3 -o pdf-ci/app/src/main/assets/libs/jszip.min.js https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK from source
        working-directory: pdf-ci
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=pdf-ci/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'assets/index.html'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" PDF-Semplice-Bilingue-V1.3-CLEAN-debug.apk
          sha256sum PDF-Semplice-Bilingue-V1.3-CLEAN-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Semplice-Bilingue-V1.3-CLEAN-APK
          path: PDF-Semplice-Bilingue-V1.3-CLEAN-debug.apk
          if-no-files-found: error
          retention-days: 7
